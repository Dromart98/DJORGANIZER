[package]
name = "djorganizer-desktop"
version = "0.1.0"
description = "DJOrganizer desktop shell"
authors = ["DJOrganizer contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "djorganizer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
lofty = "0.24"
ndarray = "0.16"
ort = "=2.0.0-rc.9"
ort-sys = "=2.0.0-rc.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
