name: Regenerate roadmap lockfile temp

on:
  pull_request:
    paths:
      - "vendor/brace-expansion-compat/package.json"
      - ".github/workflows/regenerate-lock-roadmap-temp.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify targeted diff
        run: git diff -- package-lock.json vendor/brace-expansion-compat/package.json
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync security lockfile from main"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
