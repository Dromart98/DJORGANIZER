name: Temporary complete archive inactive
on:
  push:
    branches: [feat/archive-inactive-tracks]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Complete inactive track archiving') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/archive-inactive-tracks
          fetch-depth: 0
      - name: Apply remaining archive behavior
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Library page treats archived/all as explicit filters and never runs the active-only filtered-crate RPC for them.
          replace_once(
              'src/app/library/page.tsx',
              '  const hasFilters = Boolean(\n    query.q ||',
              '  const hasFilters = Boolean(\n    query.status !== "active" ||\n      query.q ||',
          )
          replace_once(
              'src/app/library/page.tsx',
              '        {hasFilters && page.count > 0 ? (',
              '        {query.status === "active" && hasFilters && page.count > 0 ? (',
          )

          # Per-track reversible controls preserve all metadata, tags and crate memberships.
          replace_once(
              'src/components/library/track-table.tsx',
              'import { deleteTracksAction } from "@/app/library/actions";',
              'import { archiveTrackAction, deleteTracksAction, restoreTrackAction } from "@/app/library/actions";',
          )
          replace_once(
              'src/components/library/track-table.tsx',
              '''                <td>
                  <Link
                    aria-label={`${t("Ver y editar")}: ${track.title}`}
                    className="table-action"
                    href={`/library/${track.id}`}
                  >
                    {t("Ver y editar")}
                  </Link>
                </td>''',
              '''                <td>
                  <div className="organization-inline-actions">
                    <Link
                      aria-label={`${t("Ver y editar")}: ${track.title}`}
                      className="table-action"
                      href={`/library/${track.id}`}
                    >
                      {t("Ver y editar")}
                    </Link>
                    <form action={track.archived_at ? restoreTrackAction : archiveTrackAction}>
                      <input name="id" type="hidden" value={track.id} />
                      <input name="returnTo" type="hidden" value={returnTo} />
                      <button className="table-action" type="submit">
                        {track.archived_at
                          ? locale === "en" ? "Restore" : "Restaurar"
                          : locale === "en" ? "Archive" : "Archivar"}
                      </button>
                    </form>
                  </div>
                </td>''',
          )
          replace_once(
              'src/components/library/track-table.tsx',
              '''            <Link
              aria-label={`${t("Editar")}: ${track.title}`}
              href={`/library/${track.id}`}
            >
              {t("Editar")}
            </Link>
          </article>''',
              '''            <div className="organization-inline-actions">
              <Link
                aria-label={`${t("Editar")}: ${track.title}`}
                href={`/library/${track.id}`}
              >
                {t("Editar")}
              </Link>
              <form action={track.archived_at ? restoreTrackAction : archiveTrackAction}>
                <input name="id" type="hidden" value={track.id} />
                <input name="returnTo" type="hidden" value={returnTo} />
                <button className="table-action" type="submit">
                  {track.archived_at
                    ? locale === "en" ? "Restore" : "Restaurar"
                    : locale === "en" ? "Archive" : "Archivar"}
                </button>
              </form>
            </div>
          </article>''',
          )

          # Smart crates: active by default, archived/all only by explicit top-level mode; legacy JSON remains valid.
          replace_once(
              'src/lib/organization/smart-crates.ts',
              'export type SmartCrateLogic = "and" | "or";\n',
              'export type SmartCrateLogic = "and" | "or";\nexport type SmartCrateTrackStatus = "active" | "archived" | "all";\n',
          )
          replace_once(
              'src/lib/organization/smart-crates.ts',
              '  .object({\n    version: z.literal(1),',
              '  .object({\n    trackStatus: z.enum(["active", "archived", "all"]).optional(),\n    version: z.literal(1),',
          )

          replace_once(
              'src/components/organization/smart-crate-form.tsx',
              '  type SmartCrateOperator,\n  type SmartCrateRules,',
              '  type SmartCrateOperator,\n  type SmartCrateRules,\n  type SmartCrateTrackStatus,',
          )
          replace_once(
              'src/components/organization/smart-crate-form.tsx',
              '  const { locale } = useTranslator();\n  const [logic, setLogic] = useState<SmartCrateLogic>(initialRules?.logic ?? "and");',
              '  const { locale } = useTranslator();\n  const [trackStatus, setTrackStatus] = useState<SmartCrateTrackStatus>(initialRules?.trackStatus ?? "active");\n  const [logic, setLogic] = useState<SmartCrateLogic>(initialRules?.logic ?? "and");',
          )
          replace_once(
              'src/components/organization/smart-crate-form.tsx',
              '  const rules = useMemo<SmartCrateRules>(() => ({\n    version: 1,',
              '  const rules = useMemo<SmartCrateRules>(() => ({\n    trackStatus,\n    version: 1,',
          )
          replace_once(
              'src/components/organization/smart-crate-form.tsx',
              '  }), [groups, logic]);',
              '  }), [groups, logic, trackStatus]);',
          )
          replace_once(
              'src/components/organization/smart-crate-form.tsx',
              '    parent: "Save inside",\n    none: "None",\n    groups:',
              '    parent: "Save inside",\n    none: "None",\n    trackStatus: "Tracks",\n    activeTracks: "Active only",\n    archivedTracks: "Archived only",\n    allTracks: "Active and archived",\n    groups:',
          )
          replace_once(
              'src/components/organization/smart-crate-form.tsx',
              '    parent: "Guardar dentro de",\n    none: "Ninguna",\n    groups:',
              '    parent: "Guardar dentro de",\n    none: "Ninguna",\n    trackStatus: "Pistas",\n    activeTracks: "Solo activas",\n    archivedTracks: "Solo archivadas",\n    allTracks: "Activas y archivadas",\n    groups:',
          )
          replace_once(
              'src/components/organization/smart-crate-form.tsx',
              '''      <label className="field">
        {text.groups}
        <select value={logic} onChange={(event) => { setLogic(event.target.value as SmartCrateLogic); setPreview(null); }}>
''',
              '''      <label className="field">
        {text.trackStatus}
        <select
          value={trackStatus}
          onChange={(event) => {
            setTrackStatus(event.target.value as SmartCrateTrackStatus);
            setPreview(null);
          }}
        >
          <option value="active">{text.activeTracks}</option>
          <option value="archived">{text.archivedTracks}</option>
          <option value="all">{text.allTracks}</option>
        </select>
      </label>
      <label className="field">
        {text.groups}
        <select value={logic} onChange={(event) => { setLogic(event.target.value as SmartCrateLogic); setPreview(null); }}>
''',
          )

          # Query and smart-rule unit coverage.
          replace_once(
              'src/lib/library/track-query.test.ts',
              '    expect(query).toMatchObject({\n      bpmMax:',
              '    expect(query).toMatchObject({\n      status: "active",\n      bpmMax:',
          )
          replace_once(
              'src/lib/library/track-query.test.ts',
              '  it("usa valores seguros para parámetros inválidos", () => {',
              '''  it("oculta archivadas por defecto y conserva un estado explícito", () => {
    expect(parseTrackQuery({}).status).toBe("active");
    expect(parseTrackQuery({ status: "archived" }).status).toBe("archived");
    expect(buildLibraryHref(parseTrackQuery({ status: "archived" }), { page: 2 })).toContain("status=archived");
  });

  it("usa valores seguros para parámetros inválidos", () => {''',
          )
          replace_once(
              'src/lib/organization/smart-crates.test.ts',
              '  it("accepts tag conditions using persistent tag ids", () => {',
              '''  it("keeps legacy rules active-only and accepts explicit archived modes", () => {
    expect(parseSmartCrateRules(rules).success).toBe(true);
    const archived = parseSmartCrateRules({ ...rules, trackStatus: "archived" });
    expect(archived.success).toBe(true);
    if (archived.success) expect(archived.data.trackStatus).toBe("archived");
    expect(parseSmartCrateRules({ ...rules, trackStatus: "invalid" }).success).toBe(false);
  });

  it("accepts tag conditions using persistent tag ids", () => {''',
          )

          # pgTAP verifies smart crates exclude archived tracks unless explicitly requested.
          p = Path('supabase/tests/database/smart_crates.test.sql')
          text = p.read_text(encoding='utf-8')
          if 'select plan(8);' not in text:
              raise SystemExit('smart-crate plan anchor missing')
          text = text.replace('select plan(8);', 'select plan(10);', 1)
          finish = 'select * from finish();\nrollback;'
          if finish not in text:
              raise SystemExit('smart-crate finish anchor missing')
          extra = '''update public.tracks
set archived_at = now()
where id = '31200000-0000-4000-8000-000000000001';

select is(
  (select count(*)::integer from public.resolve_smart_crate_rule_tracks(
    '{"version":1,"logic":"and","groups":[{"logic":"and","conditions":[{"field":"tag","operator":"has","value":"31300000-0000-4000-8000-000000000001"}]}]}'::jsonb,
    0, 100, null
  )),
  0,
  'Smart crates exclude archived tracks by default'
);

select is(
  (select count(*)::integer from public.resolve_smart_crate_rule_tracks(
    '{"version":1,"trackStatus":"archived","logic":"and","groups":[{"logic":"and","conditions":[{"field":"tag","operator":"has","value":"31300000-0000-4000-8000-000000000001"}]}]}'::jsonb,
    0, 100, null
  )),
  1,
  'Smart crates include archived tracks only through an explicit mode'
);

'''
          p.write_text(text.replace(finish, extra + finish, 1), encoding='utf-8')

          # Migration reuses the existing reviewed resolver bodies and adds only archive predicates.
          smart_source = Path('supabase/migrations/20260815102000_smart_crates.sql').read_text(encoding='utf-8')
          smart_function = smart_source[smart_source.index('create or replace function public.resolve_smart_crate_rule_tracks('):]
          anchor = "    where t.user_id = (select auth.uid())\n      and jsonb_typeof(p_rules) = 'object'"
          if anchor not in smart_function:
              raise SystemExit('smart resolver anchor missing')
          smart_function = smart_function.replace(anchor, '''    where t.user_id = (select auth.uid())
      and case coalesce(p_rules ->> 'trackStatus', 'active')
        when 'active' then t.archived_at is null
        when 'archived' then t.archived_at is not null
        when 'all' then true
        else false
      end
      and jsonb_typeof(p_rules) = 'object' ''', 1)

          filtered = Path('supabase/migrations/20260814154500_create_filtered_crate_rpc.sql').read_text(encoding='utf-8')
          filtered_anchor = '    where tracks.user_id = current_user_id\n      and ('
          if filtered_anchor not in filtered:
              raise SystemExit('filtered crate resolver anchor missing')
          filtered = filtered.replace(filtered_anchor, '    where tracks.user_id = current_user_id\n      and tracks.archived_at is null\n      and (', 1)
          migration = '''alter table public.tracks
  add column archived_at timestamptz;

create index tracks_user_archived_at_idx
  on public.tracks (user_id, archived_at);

''' + smart_function.strip() + '\n\n' + filtered.strip() + '\n'
          Path('supabase/migrations/20260815140000_archive_inactive_tracks.sql').write_text(migration, encoding='utf-8')

          # Authenticated browser regression: archive, default disappearance, explicit archived view, restore.
          Path('tests/e2e/authenticated-library-archive.spec.ts').write_text('''import { expect, test } from "@playwright/test";

test.skip(process.env.E2E_AUTHENTICATED !== "1", "Requires the ephemeral Supabase stack configured by CI.");

test("@authenticated archives and restores a library track without deleting it", async ({ page }, testInfo) => {
  const runId = `${Date.now()}-${testInfo.workerIndex}`;
  const email = `e2e-archive-${runId}@djorganizer.test`;
  const password = `DjOrganizer-${runId}!`;
  const title = `Archive ${runId}`;
  await page.context().addCookies([{ name: "djorganizer-locale", url: "http://127.0.0.1:3100", value: "en" }]);
  await page.goto("/signup?next=/library/new");
  await page.getByLabel("Name").fill("Archive E2E");
  await page.getByLabel("Email").fill(email);
  await page.getByLabel("Password").fill(password);
  await page.getByRole("button", { name: "Create account" }).click();
  await expect(page).toHaveURL(/\\/library\\/new$/, { timeout: 20_000 });
  await page.getByLabel("Title *").fill(title);
  await page.getByRole("button", { name: "Add track" }).click();
  await expect(page).toHaveURL(/\\/library\\/[0-9a-f-]+$/, { timeout: 20_000 });

  await page.goto("/library");
  let row = page.locator("tbody tr").filter({ hasText: title });
  await expect(row).toHaveCount(1);
  await row.getByRole("button", { name: "Archive" }).click();
  await expect(page.locator("tbody tr").filter({ hasText: title })).toHaveCount(0, { timeout: 20_000 });

  await page.getByLabel("Status").selectOption("archived");
  await page.getByRole("button", { name: "Apply" }).click();
  await expect(page).toHaveURL(/status=archived/);
  row = page.locator("tbody tr").filter({ hasText: title });
  await expect(row).toHaveCount(1);
  await row.getByRole("button", { name: "Restore" }).click();
  await expect(page.locator("tbody tr").filter({ hasText: title })).toHaveCount(0, { timeout: 20_000 });

  await page.goto("/library");
  await expect(page.locator("tbody tr").filter({ hasText: title })).toHaveCount(1);
});
''', encoding='utf-8')

          replace_once(
              'docs/roadmap.md',
              '5. - [ ] Permitir archivar pistas inactivas sin borrar ni mover el archivo.',
              '5. - [x] Permitir archivar pistas inactivas sin borrar ni mover el archivo.',
          )
      - name: Commit product delta
        run: |
          git config user.name "Dromart98"
          git config user.email "davidromanmartin@yahoo.es"
          git rm .github/workflows/temporary-complete-archive-inactive.yml
          git add docs/roadmap.md src supabase tests/e2e/authenticated-library-archive.spec.ts
          git commit -m "Complete inactive track archiving"
          git push origin HEAD:feat/archive-inactive-tracks
