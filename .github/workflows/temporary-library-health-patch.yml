name: Temporary library health patch

on:
  push:
    branches:
      - feat/library-health-center

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Wire scan health into folder refresh') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-health-center
          fetch-depth: 0
      - name: Apply focused scanner patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/desktop/folder-scanner.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label} anchor count: {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              '  const { clearTrackLinks, replaceTrackLinks } = useDesktopScanSession();',
              '  const { clearTrackLinks, replaceScanHealth, replaceTrackLinks } = useDesktopScanSession();',
              'provider destructuring',
          )
          replace_once(
              '      clearTrackLinks();\n      setLinkedEnergyByScanId(new Map());',
              '      setLinkedEnergyByScanId(new Map());',
              'link reset',
          )
          replace_once(
              '        if (!library.candidates.length) {\n',
              '        if (!library.candidates.length) {\n          replaceTrackLinks(scanResult.sessionId, []);\n',
              'no candidates',
          )
          replace_once(
              '        replaceTrackLinks(scanResult.sessionId, linkResult.links);',
              '''        const relativePathByScanId = new Map(
                    scanResult.tracks.map((track) => [track.scanId, track.relativePath]),
                  );
                  replaceTrackLinks(
                    scanResult.sessionId,
                    linkResult.links.map((link) => ({
                      ...link,
                      relativePath: relativePathByScanId.get(link.scanId),
                    })),
                  );''',
              'replace links',
          )
          replace_once(
              '      clearTrackLinks();\n      setWatchingFolder(false);',
              '      clearTrackLinks();\n      replaceScanHealth(nextResult);\n      setWatchingFolder(false);',
              'initial scan health',
          )
          replace_once(
              '        setResult(incremental.scan);\n',
              '        setResult(incremental.scan);\n        replaceScanHealth(incremental.scan);\n',
              'incremental scan health',
          )
          replace_once(
              '    [clearTrackLinks, locale, replaceTrackLinks, t],',
              '    [locale, replaceTrackLinks, t],',
              'link callback deps',
          )

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-library-health-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire scan health into folder refresh"
          git push origin HEAD:feat/library-health-center
