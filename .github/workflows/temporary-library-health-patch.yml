name: Temporary library health patch

on:
  push:
    branches:
      - feat/library-health-center

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Wire scan health into folder refresh') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-health-center
          fetch-depth: 0
      - name: Apply focused scanner patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/desktop/folder-scanner.tsx')
          text = path.read_text(encoding='utf-8')

          old = '  const { clearTrackLinks, replaceTrackLinks } = useDesktopScanSession();'
          new = '  const { clearTrackLinks, replaceScanHealth, replaceTrackLinks } = useDesktopScanSession();'
          if old not in text:
              raise SystemExit('provider destructuring anchor not found')
          text = text.replace(old, new, 1)

          old = '''    async (core: TauriCore, scanResult: FolderScanResult) => {
                clearTrackLinks();
                setLinkedEnergyByScanId(new Map());'''
          new = '''    async (core: TauriCore, scanResult: FolderScanResult) => {
                setLinkedEnergyByScanId(new Map());'''
          if old not in text:
              raise SystemExit('link reset anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (!library.candidates.length) {
                  setLibraryLinkMessage('''
          new = '''        if (!library.candidates.length) {
                  replaceTrackLinks(scanResult.sessionId, []);
                  setLibraryLinkMessage('''
          if old not in text:
              raise SystemExit('no-candidates anchor not found')
          text = text.replace(old, new, 1)

          old = '        replaceTrackLinks(scanResult.sessionId, linkResult.links);'
          new = '''        const relativePathByScanId = new Map(
                  scanResult.tracks.map((track) => [track.scanId, track.relativePath]),
                );
                replaceTrackLinks(
                  scanResult.sessionId,
                  linkResult.links.map((link) => ({
                    ...link,
                    relativePath: relativePathByScanId.get(link.scanId),
                  })),
                );'''
          if old not in text:
              raise SystemExit('replace links anchor not found')
          text = text.replace(old, new, 1)

          old = '''      setResult(nextResult);
                clearTrackLinks();
                setWatchingFolder(false);'''
          new = '''      setResult(nextResult);
                clearTrackLinks();
                replaceScanHealth(nextResult);
                setWatchingFolder(false);'''
          if old not in text:
              raise SystemExit('initial scan health anchor not found')
          text = text.replace(old, new, 1)

          old = '''        setResult(incremental.scan);
                setSelectedTrackIds('''
          new = '''        setResult(incremental.scan);
                replaceScanHealth(incremental.scan);
                setSelectedTrackIds('''
          if old not in text:
              raise SystemExit('incremental scan health anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '    [clearTrackLinks, locale, replaceTrackLinks, t],',
              '    [locale, replaceTrackLinks, t],',
              1,
          )

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-library-health-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire scan health into folder refresh"
          git push origin HEAD:feat/library-health-center
