name: Temporary fix PR124 MSRV

on:
  push:
    branches:
      - feat/repair-lost-track-references

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repair-lost-track-references
          fetch-depth: 0
      - name: Apply focused MSRV fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/lost_track_repair.rs')
          text = path.read_text(encoding='utf-8')
          old_import = 'use std::{cmp::Ordering, collections::HashSet, fs, path::Path};'
          new_import = 'use std::{collections::HashSet, fs, path::Path};'
          old_derive = '#[derive(Clone, Debug, Serialize)]\n#[serde(rename_all = "camelCase")]\npub(super) struct LostTrackRepairApplyResult {'
          new_derive = '#[derive(Debug, Serialize)]\n#[serde(rename_all = "camelCase")]\npub(super) struct LostTrackRepairApplyResult {'
          if old_import not in text:
              raise SystemExit('unused import anchor not found')
          if old_derive not in text:
              raise SystemExit('apply result derive anchor not found')
          text = text.replace(old_import, new_import, 1).replace(old_derive, new_derive, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "Dromart98"
          git config user.email "davidromanmartin@yahoo.es"
          git rm .github/workflows/temporary-fix-pr124-msrv.yml
          git add src-tauri/src/lost_track_repair.rs
          git commit -m "Fix lost repair MSRV compatibility"
          git push origin HEAD:feat/repair-lost-track-references
