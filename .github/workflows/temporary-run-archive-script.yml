name: Temporary archive patch runner

on:
  push:
    branches:
      - feat/archive-inactive-tracks

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/archive-inactive-tracks
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/finalize_archive_contract.py
      - name: Commit
        run: |
          git config user.name "Dromart98"
          git config user.email "davidromanmartin@yahoo.es"
          git rm .github/scripts/finalize_archive_contract.py .github/workflows/temporary-run-archive-script.yml .github/archive-patch-trigger.txt
          git add docs/roadmap.md src supabase tests/e2e/authenticated-library-archive.spec.ts
          git commit -m "Complete archive contract"
          git push origin HEAD:feat/archive-inactive-tracks
