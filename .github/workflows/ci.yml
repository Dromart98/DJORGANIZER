name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit diagnostic
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch "$GITHUB_HEAD_REF" "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          set +e
          npm audit --audit-level=high --json > audit.json
          status=$?
          node -e 'const j=require("./audit.json"); for (const [name,v] of Object.entries(j.vulnerabilities ?? {})) { if (["high","critical"].includes(v.severity)) { const via=(v.via ?? []).map((x) => typeof x === "string" ? x : x.title).join(" | "); console.log(`${name}: ${v.severity}; via=${via}; range=${v.range}; nodes=${(v.nodes ?? []).join(",")}; fix=${JSON.stringify(v.fixAvailable)}`); } } console.log(`totals=${JSON.stringify(j.metadata?.vulnerabilities ?? {})}`);'
          exit "$status"
