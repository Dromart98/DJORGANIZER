name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-health-reconciliation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/library-health-center
          fetch-depth: 0

      - name: Apply missing-file proof patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/desktop/folder-scanner.tsx')
          text = path.read_text(encoding='utf-8')

          old = '          if (!library.message) replaceTrackLinks(scanResult.sessionId, []);'
          new = '''          if (!library.message) {
            replaceTrackLinks(scanResult.sessionId, [], {
              scannedRelativePaths: scanResult.tracks.map(
                (track) => track.relativePath,
              ),
            });
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'empty links anchor count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''          })),
          !library.message,
        );'''
          new = '''          })),
          {
            coverageComplete: !library.message,
            scannedRelativePaths: scanResult.tracks.map(
              (track) => track.relativePath,
            ),
          },
        );'''
          if text.count(old) != 1:
              raise SystemExit(f'linked paths anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Restore CI and commit patch
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/temporary-missing-file-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use confirmed paths for missing files"
          git push origin HEAD:feat/library-health-center

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run test:e2e -- --project=chromium

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Start local database
        run: supabase db start

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Test RLS and user separation
        id: database-tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee database-test.log

      - name: Upload database test failure
        if: failure() && steps.database-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: database-test-failure
          path: database-test.log
          if-no-files-found: error
          retention-days: 1

  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_AUTHENTICATED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Install dependencies
        run: npm ci

      - name: Start ephemeral Supabase
        run: supabase start

      - name: Export local Supabase variables
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test authenticated import, library and crates
        run: npm run test:e2e -- --project=chromium --grep @authenticated

      - name: Test Crates scrolling on mobile
        run: npm run test:e2e -- tests/e2e/authenticated-crates-scroll.spec.ts --project=mobile

      - name: Upload authenticated Playwright failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-playwright-failure
          path: test-results
          if-no-files-found: warn
          retention-days: 1

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Check desktop
        working-directory: src-tauri
        run: cargo check --locked

      - name: Test desktop
        working-directory: src-tauri
        run: cargo test --locked
