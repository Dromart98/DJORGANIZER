name: Temporary wire lost track repair

on:
  push:
    branches:
      - feat/repair-lost-track-references

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repair-lost-track-references
          fetch-depth: 0
      - name: Patch native command wiring
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label} anchor count: {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              'mod audio_resampler;\nmod maest;',
              'mod audio_resampler;\nmod lost_track_repair;\nmod maest;',
              'module',
          )
          replace_once(
              '    pending_maest_genre_previews: Mutex<HashMap<MaestGenrePreviewKey, MaestGenrePreviewReceipt>>,\n    reorganization_history:',
              '    pending_maest_genre_previews: Mutex<HashMap<MaestGenrePreviewKey, MaestGenrePreviewReceipt>>,\n    pending_lost_track_repairs: Mutex<HashMap<(String, String, String), lost_track_repair::LostTrackRepairReceipt>>,\n    reorganization_history:',
              'state',
          )

          marker = '''#[tauri::command(rename_all = "camelCase")]
          async fn preview_reorganization_plan('''
          wrappers = '''#[tauri::command(rename_all = "camelCase")]
          async fn preview_lost_track_repairs(
              app: AppHandle,
              state: State<'_, DesktopState>,
              session_id: String,
              library_tracks: Vec<lost_track_repair::LostTrackRepairLibraryTrack>,
          ) -> Result<lost_track_repair::LostTrackRepairPreview, String> {
              let alias_path = app
                  .path()
                  .app_data_dir()
                  .map_err(|_| "No se pudo abrir el estado local de vínculos.".to_owned())?
                  .join(LIBRARY_FILE_ALIASES_NAME);
              lost_track_repair::preview(
                  state.inner(),
                  session_id,
                  library_tracks,
                  &alias_path,
              )
          }

          #[tauri::command(rename_all = "camelCase")]
          async fn apply_lost_track_repairs(
              app: AppHandle,
              state: State<'_, DesktopState>,
              session_id: String,
              selections: Vec<lost_track_repair::LostTrackRepairSelection>,
          ) -> Result<lost_track_repair::LostTrackRepairApplyResult, String> {
              let alias_path = app
                  .path()
                  .app_data_dir()
                  .map_err(|_| "No se pudo abrir el estado local de vínculos.".to_owned())?
                  .join(LIBRARY_FILE_ALIASES_NAME);
              lost_track_repair::apply(
                  state.inner(),
                  session_id,
                  selections,
                  &alias_path,
              )
          }

          #[tauri::command(rename_all = "camelCase")]
          async fn preview_reorganization_plan('''
          replace_once(marker, wrappers, 'wrapper')
          replace_once(
              '            link_library_tracks,\n            preview_maest_genre_write,',
              '            link_library_tracks,\n            preview_lost_track_repairs,\n            apply_lost_track_repairs,\n            preview_maest_genre_write,',
              'handler',
          )

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-wire-lost-repair.yml').unlink()
      - name: Commit native wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire native lost track repair commands"
          git push origin HEAD:feat/repair-lost-track-references
