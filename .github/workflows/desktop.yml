name: Desktop Validate

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORARY: remove after pinning the independently verified digest.
      - name: Diagnose official MAEST ONNX integrity
        shell: bash
        run: |
          set -euo pipefail
          readonly name="discogs-maest-30s-pw-519l-2.onnx"
          readonly expected_bytes="348052337"
          readonly target="$RUNNER_TEMP/$name"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 900 \
            --output "$target" \
            "https://essentia.upf.edu/models/feature-extractors/maest/$name"
          actual_bytes="$(stat -c%s "$target")"
          test "$actual_bytes" = "$expected_bytes"
          digest="$(sha256sum "$target" | cut -d ' ' -f 1)"
          integrity_file="$RUNNER_TEMP/maest-integrity.txt"
          printf 'artifact=%s\nbytes=%s\nsha256=%s\n' \
            "$name" \
            "$actual_bytes" \
            "$digest" > "$integrity_file"
          cat "$integrity_file"
          rm -f "$target"

      - name: Upload MAEST integrity diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: maest-integrity-diagnostic
          path: ${{ runner.temp }}/maest-integrity.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check desktop crate
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          else
            cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          fi

      - name: Run desktop tests
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml
          else
            cargo test --manifest-path src-tauri/Cargo.toml
          fi
