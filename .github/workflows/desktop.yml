name: Desktop Validate

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"
      - "docs/desktop-maest-foundation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check desktop crate
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          else
            cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          fi

      - name: Run desktop tests
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml
          else
            cargo test --manifest-path src-tauri/Cargo.toml
          fi

  # TEMPORARY: remove after PR #67 records a successful Windows installer inspection.
  maest-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build unsigned Windows NSIS installer
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis

      - name: Validate MAEST runtime on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $model = Join-Path $env:RUNNER_TEMP "discogs-maest-30s-pw-519l-2.onnx"
          Invoke-WebRequest \
            -Uri "https://essentia.upf.edu/models/feature-extractors/maest/discogs-maest-30s-pw-519l-2.onnx" \
            -OutFile $model
          $file = Get-Item $model
          if ($file.Length -ne 348052337) { throw "Unexpected ONNX byte length" }
          $hash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c90a51a752cdd94f37de886787d5e3a5b2071c6d0ef49ea788058f65f11883b1") {
            throw "Unexpected ONNX SHA-256"
          }
          $env:DJORGANIZER_MAEST_MODEL = $model
          cargo test --release --locked \
            --manifest-path src-tauri/Cargo.toml \
            maest::tests::runs_the_official_model_with_a_deterministic_tensor \
            -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Windows MAEST inference failed" }
          Remove-Item $model -Force

      - name: Install and inspect Windows NSIS package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Resolve-Path "src-tauri/target/release"
          $app = Get-ChildItem $release -File -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "uninstall|setup" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $app) { throw "Release executable not found" }

          $installer = Get-ChildItem "$release/bundle/nsis" -File -Filter "*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = (& $vswhere -latest -products * \
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
            -property installationPath | Select-Object -First 1)
          if (-not $vsRoot) { throw "Visual Studio C++ tools not found" }
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC" -Recurse -File -Filter "dumpbin.exe" |
            Where-Object { $_.FullName -match "Hostx64\\x64\\dumpbin\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $dependencies = (& $dumpbin.FullName /DEPENDENTS $app.FullName | Out-String)
          $dynamicOrt = $dependencies -match "(?i)onnxruntime\.dll"

          $installDir = Join-Path $env:RUNNER_TEMP "DJOrganizerInstalled"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $process = Start-Process -FilePath $installer.FullName \
            -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }

          $installedApp = Get-ChildItem $installDir -Recurse -File -Filter $app.Name |
            Select-Object -First 1
          if (-not $installedApp) { throw "Installed executable not found" }
          $sourceHash = (Get-FileHash $app.FullName -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash $installedApp.FullName -Algorithm SHA256).Hash
          if ($sourceHash -ne $installedHash) {
            throw "Installed executable differs from the release executable"
          }

          $installedRuntime = Get-ChildItem $installDir -Recurse -File -Filter "onnxruntime.dll" |
            Select-Object -First 1
          if ($dynamicOrt) {
            if (-not $installedRuntime) {
              throw "Executable imports onnxruntime.dll but installer does not contain it"
            }
            if ($installedRuntime.DirectoryName -ne $installedApp.DirectoryName) {
              throw "onnxruntime.dll is not installed beside the executable"
            }
            $linkage = "dynamic"
          } else {
            if ($installedRuntime) {
              throw "Unexpected onnxruntime.dll for a statically linked executable"
            }
            $linkage = "static"
          }

          Write-Host "app_executable=$($app.Name)"
          Write-Host "installer=$($installer.Name)"
          Write-Host "installed_app=$($installedApp.FullName)"
          Write-Host "onnxruntime_linkage=$linkage"
          Write-Host "windows_real_inference=verified"
          Write-Host "windows_nsis_installation=verified"
