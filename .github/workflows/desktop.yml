name: Desktop Validate

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"
      - "docs/desktop-maest-foundation.md"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  desktop-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified MAEST output correction
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src-tauri/src/maest.rs")
          text = source.read_text(encoding="utf-8")
          old = 'output_name: "PartitionedCall/Identity_13",'
          new = 'output_name: "activations",'
          if old in text:
              text = text.replace(old, new, 1)
              source.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("MAEST output manifest anchor not found")

          docs = Path("docs/desktop-maest-foundation.md")
          text = docs.read_text(encoding="utf-8")
          old = "- Salida sigmoid `PartitionedCall/Identity_13`, `[1, 519]`. La salida directa hace redundante cargar `genre_discogs519` para este artefacto."
          new = "- La metadata TensorFlow identifica la salida sigmoid como `PartitionedCall/Identity_13`; ONNX Runtime la expone como `activations`, `float32`, `[1, 519]`. La salida directa hace redundante cargar `genre_discogs519` para este artefacto."
          if old in text:
              docs.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("MAEST documentation output anchor not found")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if git diff --quiet; then
            echo "MAEST output correction already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/src/maest.rs docs/desktop-maest-foundation.md
            git commit -m "fix(maest): use ONNX Runtime activations output"
            git push origin HEAD:codex/implementar-analizador-maest-para-escritorio
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check desktop crate
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          else
            cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          fi

      - name: Run desktop tests
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml
          else
            cargo test --manifest-path src-tauri/Cargo.toml
          fi

  # TEMPORARY: remove after PR #67 records a successful real-model inference.
  maest-real-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install --no-install-recommends -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev >/dev/null

      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal >/dev/null
          rustup default stable >/dev/null

      - name: Validate MAEST real ONNX inference
        shell: bash
        run: |
          set -euo pipefail
          readonly model="$RUNNER_TEMP/discogs-maest-30s-pw-519l-2.onnx"
          trap 'rm -f "$model"' EXIT
          curl --silent --show-error --fail --location --retry 2 \
            --connect-timeout 20 --max-time 900 \
            --output "$model" \
            "https://essentia.upf.edu/models/feature-extractors/maest/discogs-maest-30s-pw-519l-2.onnx"
          actual_bytes="$(stat -c%s "$model")"
          actual_sha256="$(sha256sum "$model" | cut -d ' ' -f 1)"
          echo "onnx_bytes=$actual_bytes"
          echo "onnx_sha256=$actual_sha256"
          test "$actual_bytes" = "348052337"
          test "$actual_sha256" = \
            "c90a51a752cdd94f37de886787d5e3a5b2071c6d0ef49ea788058f65f11883b1"

          set +e
          output="$(DJORGANIZER_MAEST_MODEL="$model" cargo test --quiet --locked \
            --manifest-path src-tauri/Cargo.toml \
            maest::tests::runs_the_official_model_with_a_deterministic_tensor \
            -- --ignored --exact --nocapture 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          diagnostic="$(printf '%s\n' "$output" | tail -n 80)"
          if [ "$status" -eq 0 ]; then
            heading='<!-- maest-real-inference-diagnostic -->**Inferencia MAEST real validada**'
          else
            heading='<!-- maest-real-inference-diagnostic -->**Diagnóstico temporal de inferencia MAEST**'
          fi
          body="$(printf '%s\n\n```text\n%s\n```' "$heading" "$diagnostic")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5105169841" \
            --method PATCH -f body="$body" >/dev/null

          exit "$status"
