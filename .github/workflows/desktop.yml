name: Desktop Validate

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  desktop-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check desktop crate
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          else
            cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          fi

      - name: Run desktop tests
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml
          else
            cargo test --manifest-path src-tauri/Cargo.toml
          fi

  # TEMPORARY: remove after PR #67 records a successful real-model inference.
  maest-real-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install --no-install-recommends -y -qq \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev >/dev/null

      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal >/dev/null
          rustup default stable >/dev/null

      - name: Validate MAEST real ONNX inference
        shell: bash
        run: |
          set -euo pipefail
          readonly model="$RUNNER_TEMP/discogs-maest-30s-pw-519l-2.onnx"
          trap 'rm -f "$model"' EXIT
          curl --silent --show-error --fail --location --retry 2 \
            --connect-timeout 20 --max-time 900 \
            --output "$model" \
            "https://essentia.upf.edu/models/feature-extractors/maest/discogs-maest-30s-pw-519l-2.onnx"
          actual_bytes="$(stat -c%s "$model")"
          actual_sha256="$(sha256sum "$model" | cut -d ' ' -f 1)"
          echo "onnx_bytes=$actual_bytes"
          echo "onnx_sha256=$actual_sha256"
          test "$actual_bytes" = "348052337"
          test "$actual_sha256" = \
            "c90a51a752cdd94f37de886787d5e3a5b2071c6d0ef49ea788058f65f11883b1"

          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/maest.rs")
          text = path.read_text(encoding="utf-8")
          anchor = '        println!("stage=contract");\n'
          insertion = '''        println!("stage=contract");
                  for input in &session.inputs {
                      println!("session_input name={} type={:?}", input.name, input.input_type);
                  }
                  for output in &session.outputs {
                      println!("session_output name={} type={:?}", output.name, output.output_type);
                  }
          '''
          if anchor not in text:
              raise SystemExit("diagnostic insertion anchor not found")
          path.write_text(text.replace(anchor, insertion, 1), encoding="utf-8")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml

          set +e
          output="$(DJORGANIZER_MAEST_MODEL="$model" cargo test --quiet --locked \
            --manifest-path src-tauri/Cargo.toml \
            maest::tests::runs_the_official_model_with_a_deterministic_tensor \
            -- --ignored --exact --nocapture 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          diagnostic="$(printf '%s\n' "$output" | tail -n 140)"
          body="$(printf '%s\n\n```text\n%s\n```' \
            '<!-- maest-real-inference-diagnostic -->**Diagnóstico temporal de inferencia MAEST**' \
            "$diagnostic")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments/5105169841" \
            --method PATCH -f body="$body" >/dev/null

          exit "$status"
