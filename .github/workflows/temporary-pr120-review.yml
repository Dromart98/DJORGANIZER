name: Temporary PR 120 review fix

on:
  push:
    branches:
      - feat/genre-subgenre-organization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genre-subgenre-organization
          fetch-depth: 0
      - name: Apply review fixes
        run: python .github/scripts/address_pr120_review.py
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep subgenre exclusions explicit"
          git push origin HEAD:feat/genre-subgenre-organization
