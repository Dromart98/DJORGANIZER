name: Synchronize dependency lock

on:
  push:
    branches:
      - codex/detect-musical-key-in-browser

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/detect-musical-key-in-browser

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/sync-lock.yml
          git commit -m "chore: synchronize dependency lockfile"
          git push

