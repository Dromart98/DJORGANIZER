name: Temporary roadmap sync

on:
  push:
    branches:
      - feat/genre-organization-template

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genre-organization-template
          fetch-depth: 0
      - name: Sync roadmap and clean temporary files
        shell: python
        run: |
          from pathlib import Path

          roadmap = Path('docs/roadmap.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '''3. - [ ] Añadir una plantilla de organización física de un solo nivel por género,
             además de las plantillas existentes. Debe previsualizar destinos, sanear
             nombres, resolver colisiones, confirmar el lote y conservar deshacer.'''
          new = '''3. - [x] Añadir una plantilla de organización física de un solo nivel por género,
             además de las plantillas existentes. Usa una única carpeta por género y
             `Género desconocido` cuando falta el dato; reutiliza la previsualización,
             saneado, resolución de colisiones, confirmación, rollback, historial y
             deshacer del motor seguro existente.'''
          if old not in text:
              raise SystemExit('roadmap anchor not found')
          roadmap.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temporary-roadmap-sync.yml').unlink()
          Path('.github/roadmap-sync-trigger.txt').unlink(missing_ok=True)
      - name: Commit roadmap sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mark genre organization template complete"
          git push origin HEAD:feat/genre-organization-template
