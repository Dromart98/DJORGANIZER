name: Link observed issues roadmap

on:
  push:
    branches:
      - agent/add-observed-app-issues-roadmap

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-observed-app-issues-roadmap
          fetch-depth: 0

      - name: Insert roadmap link and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Próximas fases prioritarias\n\n"
          section = """### Incidencias observadas y ajustes de flujo — 2026-07-23

Antes de continuar con nuevas funciones, resolver por orden los bloques P0, P1
y P2 derivados del uso real: estabilidad de Inicio, visibilidad de etiquetas,
análisis musical unificado, navegación, lenguaje y estabilidad visual. No se
debe avanzar a un bloque posterior mientras siga abierto un error base del
anterior.

El diagnóstico, alcance, restricciones y criterios de validación están en
[`docs/roadmap-incidencias-observadas.md`](./roadmap-incidencias-observadas.md).

"""
          if "### Incidencias observadas y ajustes de flujo — 2026-07-23" not in text:
              if marker not in text:
                  raise SystemExit("No se encontró el punto de inserción del roadmap")
              text = text.replace(marker, marker + section, 1)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/link-observed-issues-roadmap.yml").unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md .github/workflows/link-observed-issues-roadmap.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Link observed issues roadmap"
          git push origin HEAD:agent/add-observed-app-issues-roadmap
