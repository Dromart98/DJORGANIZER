name: Temporary PR 118 review fix

on:
  push:
    branches:
      - feat/bpm-range-organization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bpm-range-organization
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python .github/scripts/address_pr118_review.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep energy link state synchronized"
          git push origin HEAD:feat/bpm-range-organization
