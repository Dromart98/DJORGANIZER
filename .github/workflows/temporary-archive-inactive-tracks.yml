async function setTracksArchivedState(formData: FormData, archived: boolean) {
  const user = await requireUser();
  const ids = [...new Set(trackIdsSchema.parse(formData.getAll("trackId")))];
  const returnTo = libraryReturnTo(formData);
  const supabase = await createClient();
  const { data, error } = await supabase
    .from("tracks")
    .update({ archived_at: archived ? new Date().toISOString() : null })
    .eq("user_id", user.id)
    .in("id", ids)
    .select("id");

  if (error || (data ?? []).length !== ids.length) {
    redirect(withLibraryStatus(returnTo, "archiveError"));
  }

  revalidatePath("/library");
  revalidatePath("/crates");
  redirect(withLibraryStatus(returnTo, archived ? "archived" : "restored"));
}

export async function archiveTracksAction(formData: FormData) {
  return setTracksArchivedState(formData, true);
}

export async function restoreTracksAction(formData: FormData) {
  return setTracksArchivedState(formData, false);
}

