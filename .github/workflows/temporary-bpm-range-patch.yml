name: Temporary BPM range patch

on:
  push:
    branches:
      - feat/bpm-range-organization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bpm-range-organization
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/bpm_range_patch.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire configurable BPM range organization"
          git push origin HEAD:feat/bpm-range-organization
