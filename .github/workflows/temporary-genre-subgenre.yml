name: Temporary genre subgenre patch

on:
  push:
    branches:
      - feat/genre-subgenre-organization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genre-subgenre-organization
          fetch-depth: 0
      - name: Apply focused patch
        run: |
          python .github/scripts/genre_subgenre_patch.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add safe genre subgenre organization"
          git push origin HEAD:feat/genre-subgenre-organization
