name: Temporary repair reference finish

on:
  push:
    branches:
      - feat/repair-lost-track-references

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repair-lost-track-references
          fetch-depth: 0
      - name: Finish integration
        shell: python
        run: |
          from pathlib import Path

          health = Path('src/components/library/library-health-desktop.tsx')
          text = health.read_text(encoding='utf-8')
          anchor = '''      </div>\n\n      {unreadable.length ? ('''
          insert = '''      </div>\n\n      {missingTrackIds.length ? (\n        <div className={styles.actions}>\n          <Link className="button button--primary" href="/library/health/repair">\n            {en ? "Repair lost references" : "Reparar referencias perdidas"}\n          </Link>\n        </div>\n      ) : null}\n\n      {unreadable.length ? ('''
          if anchor not in text:
              raise SystemExit('health integration anchor not found')
          health.write_text(text.replace(anchor, insert, 1), encoding='utf-8')

          roadmap = Path('docs/roadmap.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '''4. - [ ] Reparar referencias a pistas perdidas mediante coincidencias verificables\n   por huella, hash cuando exista, tamaño, duración y metadatos. Mostrar las\n   alternativas y su confianza, exigir confirmación por pista o lote y no inventar\n   coincidencias. Las rutas absolutas permanecerán dentro de la sesión nativa.'''
          new = '''4. - [x] Reparar referencias a pistas perdidas mediante coincidencias verificables\n   por huella/hash, tamaño, duración y metadatos. El centro de salud prepara hasta\n   25 referencias por lote y Tauri muestra como máximo tres alternativas por pista\n   con confianza y razones visibles. La coincidencia exacta por hash+tamaño obtiene\n   confianza máxima; la recuperación por metadatos exige título+duración y artista\n   o álbum con un umbral conservador. Ningún candidato se aplica automáticamente:\n   el usuario confirma cada reparación y Tauri revalida sesión, versión, huella y\n   alias original antes de guardar únicamente el vínculo local. Las rutas absolutas\n   permanecen dentro de la sesión nativa y ningún archivo de audio se modifica.'''
          if old not in text:
              raise SystemExit('roadmap anchor not found')
          roadmap.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit final integration
        run: |
          git config user.name "Dromart98"
          git config user.email "davidromanmartin@yahoo.es"
          git add src/components/library/library-health-desktop.tsx docs/roadmap.md
          git rm .github/workflows/temporary-repair-reference-finish.yml
          git commit -m "Finish lost reference repair integration"
          git push origin HEAD:feat/repair-lost-track-references
