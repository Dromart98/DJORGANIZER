name: Temporary link coverage patch

on:
  push:
    branches:
      - feat/library-health-center

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Respect incomplete library link coverage') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-health-center
          fetch-depth: 0
      - name: Patch link coverage
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/desktop/folder-scanner.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''          linkResult.links.map((link) => ({
                      ...link,
                      relativePath: relativePathByScanId.get(link.scanId),
                    })),
                  );'''
          new = '''          linkResult.links.map((link) => ({
                      ...link,
                      relativePath: relativePathByScanId.get(link.scanId),
                    })),
                    !library.message,
                  );'''
          if old not in text:
              raise SystemExit('link coverage anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temporary-link-coverage.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Respect incomplete library link coverage"
          git push origin HEAD:feat/library-health-center
