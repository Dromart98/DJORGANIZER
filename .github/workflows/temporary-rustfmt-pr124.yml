name: Temporary rustfmt PR124

on:
  push:
    branches:
      - feat/repair-lost-track-references

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, 'Apply rustfmt for PR124') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repair-lost-track-references
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo +1.97.1 fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src-tauri/src/lost_track_repair.rs
          git diff --cached --quiet && exit 0
          git commit -m "Apply rustfmt for PR124"
          git push origin HEAD:feat/repair-lost-track-references
