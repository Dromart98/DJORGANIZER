name: Temporary secure lost repair

on:
  push:
    branches:
      - feat/repair-lost-track-references

permissions:
  contents: write

jobs:
  secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repair-lost-track-references
          fetch-depth: 0
      - name: Apply focused security fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/lost_track_repair.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'read_local_alias_store, valid_library_track_id, DesktopState, FileVersion, LibraryTrackLink,\n    LocalFileIdentity, ScanSession, SessionTrack, MAX_SAFE_JSON_INTEGER,',
              'read_audio_metadata, read_local_alias_store, valid_library_track_id, DesktopState, FileVersion,\n    LibraryTrackLink, LocalFileIdentity, ScanSession, SessionTrack, MAX_SAFE_JSON_INTEGER,',
              1,
          )
          text = text.replace('use std::{collections::HashSet, fs, path::Path};', 'use std::{collections::HashSet, fs, path::{Path, PathBuf}};', 1)

          start = text.index('fn score_candidate(')
          end = text.index('\nfn valid_library_track(', start)
          replacement = r'''fn validated_candidate_file(
    session: &ScanSession,
    track: &SessionTrack,
) -> Option<(PathBuf, fs::Metadata, FileVersion)> {
    if !session.root.is_absolute() || !track.absolute_path.is_absolute() {
        return None;
    }
    let link_metadata = fs::symlink_metadata(&track.absolute_path).ok()?;
    if link_metadata.file_type().is_symlink() || !link_metadata.is_file() {
        return None;
    }
    let canonical_root = fs::canonicalize(&session.root).ok()?;
    let canonical_path = fs::canonicalize(&track.absolute_path).ok()?;
    if !canonical_path.starts_with(&canonical_root) {
        return None;
    }
    let expected_path = session.root.join(Path::new(&track.track.relative_path));
    if fs::canonicalize(expected_path).ok()? != canonical_path {
        return None;
    }
    let metadata = fs::metadata(&canonical_path).ok()?;
    if !metadata.is_file() {
        return None;
    }
    let version = file_version(&metadata);
    let expected = session.file_versions.get(&track.track.relative_path)?;
    if expected != &version {
        return None;
    }
    Some((canonical_path, metadata, version))
}

fn score_candidate(
    library: &LostTrackRepairLibraryTrack,
    canonical_path: &Path,
    size: u64,
) -> Option<(u8, Vec<&'static str>, [u8; 32])> {
    let old_fingerprint = parse_library_fingerprint(&library.file_fingerprint).ok()?;

    if size == library.file_size {
        if let Ok(fingerprint) = hash_file(canonical_path, size) {
            if fingerprint == old_fingerprint {
                return Some((100, vec!["hash", "size"], fingerprint));
            }
        }
    }

    // Metadata fallback must use the file that exists now, never the stale scan snapshot.
    let current = read_audio_metadata(canonical_path).ok()?;
    let title_match = same_text(Some(&library.title), current.title.as_deref());
    let artist_match = same_text(library.artist.as_deref(), current.artist.as_deref());
    let album_match = same_text(library.album.as_deref(), current.album.as_deref());
    let genre_match = same_text(library.genre.as_deref(), current.genre.as_deref());
    let duration_difference = match (
        valid_duration(library.duration_seconds),
        valid_duration(current.duration_seconds),
    ) {
        (Some(left), Some(right)) => Some((left - right).abs()),
        _ => None,
    };
    let duration_strong = duration_difference.is_some_and(|difference| difference <= 0.75);
    let duration_close = duration_difference.is_some_and(|difference| difference <= 2.0);

    if !title_match || !duration_close || !(artist_match || album_match) {
        return None;
    }

    let mut score = 0_u8;
    let mut reasons = Vec::new();
    if title_match { score = score.saturating_add(25); reasons.push("title"); }
    if artist_match { score = score.saturating_add(20); reasons.push("artist"); }
    if album_match { score = score.saturating_add(8); reasons.push("album"); }
    if genre_match { score = score.saturating_add(5); reasons.push("genre"); }
    if duration_strong {
        score = score.saturating_add(35);
        reasons.push("duration");
    } else if duration_close {
        score = score.saturating_add(25);
        reasons.push("duration");
    }
    if library.file_size > 0 {
        let difference = library.file_size.abs_diff(size) as f64 / library.file_size as f64;
        if difference <= 0.005 {
            score = score.saturating_add(7);
            reasons.push("size");
        } else if difference <= 0.02 {
            score = score.saturating_add(4);
            reasons.push("size");
        }
    }
    if score < MIN_REPAIR_CONFIDENCE { return None; }
    let fingerprint = hash_file(canonical_path, size).ok()?;
    Some((score.min(99), reasons, fingerprint))
}
'''
          text = text[:start] + replacement + text[end:]

          start = text.index('fn score_for_library_track(')
          end = text.index('\npub(super) fn preview(', start)
          replacement = r'''fn score_for_library_track(
    session: &ScanSession,
    library: &LostTrackRepairLibraryTrack,
) -> Vec<ScoredCandidate> {
    let already_linked_scan_ids = session
        .library_links
        .values()
        .map(String::as_str)
        .collect::<HashSet<_>>();
    let mut scored = session
        .tracks
        .values()
        .filter(|track| !already_linked_scan_ids.contains(track.track.scan_id.as_str()))
        .filter_map(|track| {
            let (canonical_path, metadata, version) = validated_candidate_file(session, track)?;
            let (confidence, reasons, fingerprint) =
                score_candidate(library, &canonical_path, metadata.len())?;
            Some(ScoredCandidate {
                confidence,
                fingerprint,
                reasons,
                track: track.clone(),
                version,
            })
        })
        .collect::<Vec<_>>();
    scored.sort_by(|left, right| {
        right.confidence.cmp(&left.confidence).then_with(|| {
            left.track
                .track
                .relative_path
                .to_ascii_lowercase()
                .cmp(&right.track.track.relative_path.to_ascii_lowercase())
        })
    });
    scored.truncate(MAX_CANDIDATES_PER_TRACK);
    scored
}
'''
          text = text[:start] + replacement + text[end:]

          old = r'''        let metadata = fs::metadata(&track.absolute_path)
            .map_err(|_| "El archivo candidato ya no está disponible.".to_owned())?;
        let expected = session
            .file_versions
            .get(&track.track.relative_path)
            .ok_or_else(|| "El archivo candidato cambió desde el escaneo.".to_owned())?;
        if file_version(&metadata) != receipt.file_version || expected != &receipt.file_version {
            return Err("El archivo candidato cambió desde la previsualización.".to_owned());
        }
        let fingerprint = hash_file(&track.absolute_path, metadata.len())
            .map_err(|_| "No se pudo volver a verificar el archivo candidato.".to_owned())?;'''
          new = r'''        let (canonical_path, metadata, current_version) =
            validated_candidate_file(session, track).ok_or_else(|| {
                "El archivo candidato ya no es un archivo válido del escaneo activo.".to_owned()
            })?;
        if current_version != receipt.file_version {
            return Err("El archivo candidato cambió desde la previsualización.".to_owned());
        }
        let fingerprint = hash_file(&canonical_path, metadata.len())
            .map_err(|_| "No se pudo volver a verificar el archivo candidato.".to_owned())?;'''
          if old not in text:
              raise SystemExit('apply validation anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name "Dromart98"
          git config user.email "davidromanmartin@yahoo.es"
          git add src-tauri/src/lost_track_repair.rs
          git rm .github/workflows/temporary-secure-lost-repair.yml
          git commit -m "Secure lost reference candidate validation"
          git push origin HEAD:feat/repair-lost-track-references
