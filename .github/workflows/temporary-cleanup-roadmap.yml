name: Temporary cleanup roadmap sync

on:
  push:
    branches:
      - feat/guided-metadata-cleanup

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guided-metadata-cleanup
          fetch-depth: 0
      - name: Mark cleanup complete
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/roadmap.md')
          text = path.read_text(encoding='utf-8')
          old = '3. - [ ] Incorporar una limpieza guiada de metadatos con propuestas revisables para'
          new = '3. - [x] Incorporar una limpieza guiada de metadatos con propuestas revisables para'
          if text.count(old) != 1:
              raise SystemExit(f'roadmap anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temporary-cleanup-roadmap.yml').unlink()
      - name: Commit roadmap sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mark guided metadata cleanup complete"
          git push origin HEAD:feat/guided-metadata-cleanup
