name: Temporary BPM range i18n patch

on:
  push:
    branches:
      - feat/bpm-range-organization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bpm-range-organization
          fetch-depth: 0
      - name: Register typed translations
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/lib/i18n/functional.ts")
          text = path.read_text(encoding="utf-8")
          genre = '  "Género / artista": "Genre / artist",\n'
          genre_new = genre + '  "Género / rango de BPM": "Genre / BPM range",\n'
          key = '  "Tonalidad / BPM": "Key / BPM",\n'
          key_new = key + '  "Rango de BPM": "BPM range",\n  "Energía / rango de BPM": "Energy / BPM range",\n  "Tonalidad / rango de BPM": "Key / BPM range",\n  "Cortes de BPM": "BPM cut points",\n'
          if genre not in text or key not in text:
              raise SystemExit("translation anchor not found")
          text = text.replace(genre, genre_new, 1).replace(key, key_new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/temporary-i18n-bpm-range.yml").unlink()
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register BPM range translations"
          git push origin HEAD:feat/bpm-range-organization
