name: Temporary smart crates app patch

on:
  push:
    branches:
      - feat/smart-crates

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smart-crates
          fetch-depth: 0
      - name: Apply smart crate app wiring
        run: python .github/scripts/smart_crates_app_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire persistent smart crates"
          git push origin HEAD:feat/smart-crates
