name: Temporary genre patch

on:
  push:
    branches:
      - feat/genre-organization-template

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Wire native genre organization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genre-organization-template
          fetch-depth: 0
      - name: Apply focused source patch
        shell: python
        run: |
          from pathlib import Path

          scanner = Path('src/components/desktop/folder-scanner.tsx')
          text = scanner.read_text(encoding='utf-8')
          if '<option value="genre">' not in text:
              anchor = '<option value="genre-artist">'
              index = text.find(anchor)
              if index < 0:
                  raise SystemExit('organization selector anchor not found')
              line_start = text.rfind('\n', 0, index) + 1
              indent = text[line_start:index]
              text = (
                  text[:line_start]
                  + indent
                  + '<option value="genre">{t("Género")}</option>\n'
                  + text[line_start:]
              )
              scanner.write_text(text, encoding='utf-8')

          rust = Path('src-tauri/src/lib.rs')
          text = rust.read_text(encoding='utf-8')
          old_enum = '''enum OrganizationScheme {
              ArtistAlbum,
              GenreArtist,
              KeyBpm,
          }'''
          new_enum = '''enum OrganizationScheme {
              ArtistAlbum,
              Genre,
              GenreArtist,
              KeyBpm,
          }'''
          if old_enum not in text:
              if 'enum OrganizationScheme {\n    ArtistAlbum,\n    Genre,\n' not in text:
                  raise SystemExit('OrganizationScheme anchor not found')
          else:
              text = text.replace(old_enum, new_enum, 1)

          old_match = '''    match scheme {
                  OrganizationScheme::GenreArtist => vec![
                      safe_path_segment(track.genre.as_deref(), "Género desconocido"),'''
          new_match = '''    match scheme {
                  OrganizationScheme::Genre => vec![safe_path_segment(
                      track.genre.as_deref(),
                      "Género desconocido",
                  )],
                  OrganizationScheme::GenreArtist => vec![
                      safe_path_segment(track.genre.as_deref(), "Género desconocido"),'''
          if 'OrganizationScheme::Genre => vec![safe_path_segment(' not in text:
              if old_match not in text:
                  raise SystemExit('organization_folders anchor not found')
              text = text.replace(old_match, new_match, 1)
          rust.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/desktop/folder-scanner.tsx src-tauri/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m "Wire native genre organization"
          git push origin HEAD:feat/genre-organization-template
